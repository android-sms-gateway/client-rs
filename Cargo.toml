[package]
name = "android-sms-gateway"
version = "0.1.0"
edition = "2021"
description = "Rust client library for SMSGate API"
authors = ["Aleksandr Soloshenko"]
license = "Apache-2.0"
repository = "https://github.com/android-sms-gateway/client-rs"
homepage = "https://sms-gate.app"
documentation = "https://docs.rs/android-sms-gateway"
readme = "README.md"
keywords = ["sms", "gateway", "android", "api", "messaging"]
categories = ["api-bindings", "web-programming"]

[package.metadata.docs.rs]
features = ["encryption"]

[dependencies]
reqwest = { version = "0.12", default-features = false, features = ["json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
chrono = { version = "0.4", features = ["serde"] }
base64 = "0.22"
percent-encoding = "2"
url = "2"
hmac = "0.12"
sha2 = "0.10"
hex = "0.4"
cipher = { version = "0.4", optional = true, features = ["alloc"] }
aes = { version = "0.8", optional = true }
cbc = { version = "0.1", optional = true }
pbkdf2 = { version = "0.12", optional = true }
sha1 = { version = "0.10", optional = true }
rand = { version = "0.8", optional = true }

[dev-dependencies]
tokio = { version = "1", features = ["full"] }
wiremock = "0.6"

[features]
default = ["rustls-tls"]
rustls-tls = ["reqwest/rustls-tls"]
native-tls = ["reqwest/native-tls"]
encryption = ["dep:aes", "dep:cbc", "dep:pbkdf2", "dep:sha1", "dep:rand", "dep:cipher"]
